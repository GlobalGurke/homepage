name: Deploy GG Store

on:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---------- Backend syntax check ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend imports
        working-directory: backend
        run: python -m compileall app

  deploy:
    needs: test-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend locally in action
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/gg-store/frontend"
          strip_components: 2
          rm: true

      - name: Upload backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "backend/*"
          target: "/var/www/gg-store/backend"
          strip_components: 1
          rm: true

      - name: Install backend and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "📁 Ensuring directories..."
            mkdir -p /var/www/gg-store/frontend
            mkdir -p /var/www/gg-store/backend

            cd /var/www/gg-store/backend

            echo "🐍 Creating Python venv..."
            python3 -m venv .venv

            echo "📦 Installing backend dependencies..."
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt

            echo "⚠️ Checking .env..."
            if [ ! -f ".env" ]; then
              echo "❌ Missing backend .env at /var/www/gg-store/backend/.env"
              echo "Create it manually with Tebex secrets before deploying."
              exit 1
            fi

            echo "🚀 Restarting FastAPI systemd service..."
            systemctl restart gg-store
            systemctl status gg-store --no-pager

            echo "🩺 Checking backend health..."
            curl -fsS http://127.0.0.1:8000/health

            echo "🔁 Reloading Apache..."
            systemctl reload apache2

            echo "✅ GG Store deployment successful"
