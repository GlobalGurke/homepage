name: Deploy React app

on:
  push:
    branches:
      - main

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  deploy:
    needs: test-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/var/www/html/kevinkraft"
          rm: true

      - name: Install, Build, and Restart on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            cd /var/www/html/kevinkraft

            echo "📦 Installing dependencies..."
            npm ci

            echo "🏗️ Building project..."
            npm run build

            echo "🚀 Restarting PM2..."
            pm2 delete kevinkraft || true
            pm2 start npm --name kevinkraft -- start
            pm2 save

            echo "🩺 Checking app on port 3000..."
            curl -f http://127.0.0.1:3000 > /dev/null

            echo "🔁 Reloading Apache..."
            systemctl reload apache2

            echo "✅ Deployment successful"
